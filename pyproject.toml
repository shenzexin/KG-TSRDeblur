[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-tsrdeblur"
version = "0.1.0"
description = "Paper-based reference implementation of Kalman-guided traffic sign deblurring"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "torchvision>=0.19,<1", "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
video = ["ultralytics>=8.2,<9", "opencv-python>=4.9,<5"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["kg_tsrdeblur*"]

